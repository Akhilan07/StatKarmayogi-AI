version: '3.8'

services:
  statkarmayogi-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statkarmayogi_sih_2026
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VITE_SHOW_VARIANT_SWITCHER=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
